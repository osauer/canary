name: pages deploy

on:
  push:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: true

# Two jobs on purpose. As one job, the deploy step listed the run's artifacts
# in the same second the upload was finalised; on 2026-11-19 it found none
# and failed, and a re-run then uploaded a second artifact of the same name,
# which the deploy step refuses. The release waits for this workflow, so that
# stopped a release fire. Apart, the deploy job starts only after the build
# job has completed, and re-running a failed deploy uploads nothing.
jobs:
  build:
    name: build main Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Build Pages artifact
        run: make pages-build pages-coverage
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/pages

  deploy:
    name: deploy main Pages artifact
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
