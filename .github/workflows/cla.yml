name: cla

# Asks first-time contributors to sign CLA.md before their pull request can be
# merged. Signatures are stored as JSON on the `cla-signatures` branch, not on
# main, so the bot never commits to main and never collides with the clean-tree
# check in `make release`.
#
# `pull_request_target` is required so the action can write a signature and set
# a status on pull requests from forks. This workflow never checks out or runs
# pull-request code, which is the risk that flag normally carries.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: check CLA signature
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/osauer/ibkr/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: osauer,dependabot[bot],*[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, please read
            the [Contributor License Agreement](https://github.com/osauer/ibkr/blob/main/CLA.md)
            and sign it by posting a comment on this pull request with exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: CLA signed. Thanks.
