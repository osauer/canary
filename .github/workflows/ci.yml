name: ci

on:
  push:
    branches: [main, release/2.x]
  pull_request:
    branches: [main, release/2.x]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (lint + vet + vulncheck + parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: make check
        run: make check CHECK_DEPS=parity-check

  # The hermetic groups are separate jobs so GitHub can run them in parallel
  # and a failure identifies its owning surface without replaying unrelated
  # packages. macOS remains deliberate local coverage: its former hosted lane
  # ran the same suite roughly 2.5 minutes slower.
  test-pkg:
    name: make test-pkg (-race; broker protocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make test-pkg
        run: make test-pkg

  test-support:
    name: make test-support (-race; command and release helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make test-support (-race; command and CI/release helpers)
        run: make test-support

  test-internal:
    name: make test-internal (-race; internal contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The regression spine proves historical fix commits are ancestors.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make test-internal (-race; internal minus daemon root)
        run: make test-internal

      - name: make regression-spine-check
        run: make regression-spine-check

  test-daemon-default:
    name: make test-daemon-default (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make test-daemon-default
        run: make test-daemon-default

  test-daemon-trading:
    name: make test-daemon-trading (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make test-daemon-trading
        run: make test-daemon-trading

  app-render:
    name: isolated Canary app render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: npm ci
        working-directory: web/app
        run: npm ci

      - name: install Chromium
        working-directory: web/app
        run: npx playwright install --with-deps chromium

      - name: make app-render-check
        run: make app-render-check

  cross-compile:
    name: cross-compile release matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build matrix (darwin/linux × amd64/arm64)
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            os=$(echo "$target" | cut -d- -f1)
            arch=$(echo "$target" | cut -d- -f2)
            echo "==> $os/$arch (default)"
            GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false -o /tmp/canary-$target ./cmd/canary
            echo "==> $os/$arch (trading)"
            GOOS=$os GOARCH=$arch go build -tags trading -trimpath -buildvcs=false -o /tmp/canary-trading-$target ./cmd/canary
          done
