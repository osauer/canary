name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (lint + vet + vulncheck + parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: make check
        run: make check CHECK_DEPS=parity-check

  test:
    name: make test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make test-pkg
        run: make test-pkg

      - name: make test-support (-race; command and CI/release helpers)
        run: make test-support

      - name: make test-daemon (Linux, sharded -race)
        if: runner.os == 'Linux'
        run: make test-daemon

      - name: make test-daemon (macOS, unsharded -race)
        if: runner.os == 'macOS'
        run: make test-daemon-unsharded

  cross-compile:
    name: cross-compile release matrix
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build matrix (darwin/linux × amd64/arm64)
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            os=$(echo "$target" | cut -d- -f1)
            arch=$(echo "$target" | cut -d- -f2)
            echo "==> $os/$arch (default)"
            GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false -o /tmp/canary-$target ./cmd/canary
            echo "==> $os/$arch (trading)"
            GOOS=$os GOARCH=$arch go build -tags trading -trimpath -buildvcs=false -o /tmp/canary-trading-$target ./cmd/canary
          done
